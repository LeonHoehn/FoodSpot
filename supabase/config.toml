project_id = "foodspot"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
# TEMP: nur für den Debug-Login-Bypass (siehe README, "Bekannte
# Übergangslösungen"), solange Sign in with Apple nicht nutzbar ist.
# Muss zusätzlich im Dashboard des LIVE-Projekts manuell aktiviert werden
# (Authentication -> Sign In / Providers -> Anonymous Sign-ins) - dieser
# Wert hier gilt nur für die lokale `supabase start`-Umgebung, ein
# `supabase config push` wird bewusst nicht ausgeführt, um bestehende
# Dashboard-Einstellungen (z. B. den Apple-Provider) nicht zu überschreiben.
enable_anonymous_sign_ins = true

[auth.external.apple]
enabled = true
client_id = "com.foodspot.app"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"
